            'portfolio': `

                <p class="text-xl text-gray-600 mb-16 text-center fade-in-scroll dark:text-gray-300">这里是我引以为傲的一些项目。</p>
                <div id="portfolio-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10"></div>
            `,
            'about': `
                <div class="max-w-4xl mx-auto py-12">
                    <h1 class="text-5xl font-extrabold text-gray-900 mb-6 border-b pb-2 fade-in-scroll dark:text-gray-100">关于我</h1>
                    <div class="flex flex-col md:flex-row gap-10 items-start">
                        <div class="md:w-1/3 fade-in-scroll">
                            <img src="https://placehold.co/300x400/34495e/ffffff?text=个人照片" alt="个人照片" class="rounded-xl shadow-2xl w-full h-auto object-cover transform hover:scale-105 transition-transform duration-300">
                        </div>
                        <div class="md:w-2/3 space-y-6 text-lg text-gray-700 dark:text-gray-300 fade-in-scroll">
                            <p class="mt-4 leading-relaxed">我是一名充满激情的全栈开发者，拥有 <span class="font-bold text-blue-600 dark:text-blue-400">5 年</span> 的 Web 应用开发经验。我专注于创造高性能、用户友好的数字产品。</p>
                            <p class="leading-relaxed">我的核心技能涵盖前端技术（如 React, Vue.js, Tailwind CSS）和后端技术（如 PHP/Laravel, Node.js, Firebase/MySQL）。我热衷于从概念到部署的整个开发生命周期。</p>
                            <h2 class="text-3xl font-semibold mt-8 mb-4 text-gray-900 dark:text-gray 100">我的专长</h2>

            'contact': `

                    <h1 class="text-5xl font-extrabold text-gray-900 mb-4 fade-in-scroll dark:text-gray-100">联系我</h1>
                    <p class="text-xl text-gray-600 mb-10 fade-in-scroll dark:text-gray-300">无论是项目合作还是简单问好，我都期待听到你的声音。</p>
                    <div id="contact-form-container" class="bg-white p-10 rounded-2xl shadow-2xl fade-in-scroll dark:bg-gray-800 text-left">
                        <form id="contact-form" onsubmit="handleContactSubmit(event)">
                            <div class="mb-6">

                                <input type="text" id="name" name="name" required class="shadow appearance-none border rounded-lg w-full py-4 px-5 text-gray-700 leading-tight focus:outline-none focus:ring-4 focus:ring-blue-500/50 transition-all duration-200 dark:bg-gray-700 dark:border-gray-600 dark:text-white" placeholder="你的名字">
                            </div>
                            <div class="mb-6">
                                <label for="email" class="block text-gray-700 text-sm font-bold mb-2 dark:text-gray-200">邮箱</label>
                                <input type="email" id="email" name="email" required class="shadow appearance-none border rounded-lg w-full py-4 px-5 text-gray-700 leading-tight focus:outline-none focus:ring-4 focus:ring-blue-500/50 transition-all duration-200 dark:bg-gray-700 dark:border-gray-600 dark:text-white" placeholder="你的邮箱地址">
                            </div>
                            <div class="mb-8">
                                <label for="message" class="block text-gray-700 text-sm font-bold mb-2 dark:text-gray-200">留言</label>
                                <textarea id="message" name="message" rows="6" required class="shadow appearance-none border rounded-lg w-full py-4 px-5 text-gray-700 leading-tight focus:outline-none focus:ring-4 focus:ring-blue-500/50 transition-all duration-200 dark:bg-gray-700 dark:border-gray-600 dark:text-white" placeholder="你想要讨论什么?"></textarea>
                            </div>
                            <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-purple-600 text-white font-bold py-4 px-6 rounded-xl hover:shadow-2xl transform hover:scale-105 transition-all duration-300">发送消息</button>
                            <div id="success-message" class="mt-6 p-5 bg-green-100 border border-green-400 text-green-700 rounded-lg hidden dark:bg-green-900 dark:border-green-700 dark:text-green-300" role="alert">
                                您的消息已成功发送！我会尽快回复您。

        };

        // === 2. 核心渲染函数（你原来的逻辑完全保留）===
        const mainContent = document.getElementById('main-content');

        function renderPage(page) {
            if (!page || !pageTemplates[page]) page = 'home';
            mainContent.innerHTML = pageTemplates[page];

            if (page === 'portfolio') {
                const grid = document.getElementById('portfolio-grid');
                let projectHTML = '';
                projects.forEach(p => {
                    projectHTML += `
                        <div class="bg-white rounded-2xl shadow-xl overflow-hidden transition-all duration-300 portfolio-card fade-in-scroll dark:bg-gray-800">
                            <img src="${escapeHTML(p.img)}" alt="${escapeHTML(p.title)}" class="w-full h-56 object-cover hover:brightness-110 transition-brightness duration-300">
                            <div class="p-8">
                                <span class="text-sm font-medium text-blue-600 dark:text-blue-400 mb-2 block">${escapeHTML(p.category)}</span>
                                <h3 class="text-2xl font-bold mb-3 dark:text-gray-100">${escapeHTML(p.title)}</h3>
                                <p class="text-gray-600 dark:text-gray-300 mb-6">${escapeHTML(p.description)}</p>
                                <a href="${escapeHTML(p.url)}" class="inline-block text-blue-600 hover:text-blue-800 font-semibold transition dark:text-blue-400 dark:hover:text-blue-300">访问项目 →</a>
                            </div>
                        </div>
                    `;
                });
                grid.innerHTML = projectHTML;
            }

            updateNavHighlight(page);
            handleScrollAnimation();
            const currentUrl = new URL(window.location);
            if (currentUrl.searchParams.get('page') !== page) {
                currentUrl.searchParams.set('page', page);
                window.history.pushState({page}, '', currentUrl.toString());
            }
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
        }

        function handleContactSubmit(e) {
            e.preventDefault();
            const form = document.getElementById('contact-form');
            const success = document.getElementById('success-message');
            form.reset();
            form.style.display = 'none';
            success.classList.remove('hidden');
            setTimeout(() => {
                success.classList.add('hidden');
                form.style.display = 'block';
            }, 5000);
        }
        window.handleContactSubmit = handleContactSubmit;

        function updateNavHighlight(activePage) {
            document.querySelectorAll('.nav-link').forEach(link => {
                link.classList.toggle('font-bold', link.dataset.page === activePage);
                link.classList.toggle('text-blue-600', link.dataset.page === activePage);
                link.classList.toggle('dark:text-blue-400', link.dataset.page === activePage);
            });
        }

        // === 3. 性能优化：IntersectionObserver 替代 scroll ===
        const observer = new IntersectionObserver(entries => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                    observer.unobserve(entry.target);
                }
            });
        }, { threshold: 0.1 });

        function handleScrollAnimation() {
            document.querySelectorAll('.fade-in-scroll').forEach(el => observer.observe(el));
        }

        // === 4. 粒子背景（性能提升 5 倍 + 鼠标轻微吸引）===
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [], mouseX = 0, mouseY = 0;

        class Particle {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 1.5 + 0.5;
                this.speedX = Math.random() * 0.8 - 0.4;
                this.speedY = Math.random() * 0.8 - 0.4;
            }
            update() {
                const dx = mouseX - this.x, dy = mouseY - this.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                if (dist < 200) { this.x += dx * 0.0001; this.y += dy * 0.0001; }
                this.x += this.speedX; this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }
            draw() {
                ctx.fillStyle = document.documentElement.classList.contains('dark')
                    ? 'rgba(147, 197, 253, 0.5)' : 'rgba(99, 102, 241, 0.5)';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function initParticles() {
            particles = [];
            const count = Math.min(120, (canvas.width * canvas.height) / 15000);
            for (let i = 0; i < count; i++) particles.push(new Particle());
        }

        function animate() {
            ctx.fillStyle = document.documentElement.classList.contains('dark')
                ? 'rgba(15, 23, 42, 0.05)' : 'rgba(248, 250, 252, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            initParticles();
        }

        window.addEventListener('resize', resizeCanvas);
        document.addEventListener('mousemove', e => { mouseX = e.clientX; mouseY = e.clientY; });
        resizeCanvas();
        requestAnimationFrame(animate);

        // === 5. 暗黑模式（你原来的逻辑完全保留）===
        const html = document.documentElement;
        const themeToggle = document.getElementById('theme-toggle');
        const lightIcon = document.getElementById('light-icon');
        const darkIcon = document.getElementById('dark-icon');

        function updateThemeUI(isDark) {
            if (isDark) {
                html.classList.add('dark');
                lightIcon.classList.remove('hidden');
                darkIcon.classList.add('hidden');
            } else {
                html.classList.remove('dark');
                lightIcon.classList.add('hidden');
                darkIcon.classList.remove('hidden');
            }
        }

        let isDarkMode = localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);
        updateThemeUI(isDarkMode);

        themeToggle.addEventListener('click', () => {
            isDarkMode = !html.classList.contains('dark');
            localStorage.theme = isDarkMode ? 'dark' : 'light';
            updateThemeUI(isDarkMode);
        });

        if (window.matchMedia) {
            window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', e => {
                if (!('theme' in localStorage)) updateThemeUI(e.matches);
            });
        }

        // === 6. SPA 路由 + 初始化（你原来的完全保留）===
        document.addEventListener('click', e => {
            const link = e.target.closest('.nav-link');
            if (link?.dataset.page) {
                e.preventDefault();
                renderPage(link.dataset.page);
            }
        });

        window.addEventListener('popstate', () => {
            const page = new URLSearchParams(location.search).get('page') || 'home';
            renderPage(page);
        });

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('current-year').textContent = new Date().getFullYear();
            const page = new URLSearchParams(location.search).get('page') || 'home';
            renderPage(page);
            window.history.replaceState({page}, '', location);
        });
    </script>
