<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>经典扫雷专业版</title>
    <style>
        :root {
            --bg-color: #c0c0c0;
            --border-light: #fff;
            --border-dark: #808080;
            --cell-size: 25px; /* 默认格子大小 */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #008080; /* 经典青色背景 */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            user-select: none;
        }

        /* 游戏主窗口 */
        .window {
            background: var(--bg-color);
            padding: 6px;
            box-shadow: 2px 2px 5px rgba(0,0,0,0.5);
            border: 2px solid #fff;
            border-right-color: #808080;
            border-bottom-color: #808080;
        }

        /* 顶部控制栏 */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 2px solid #808080;
            border-right-color: #fff;
            border-bottom-color: #fff;
            padding: 6px;
            margin-bottom: 6px;
            background: #c0c0c0;
        }

        /* LCD 数字显示屏 */
        .lcd-display {
            background: #000;
            color: #ff0000;
            font-family: 'Courier New', monospace; /* 模拟LCD */
            font-size: 24px;
            font-weight: bold;
            padding: 2px 4px;
            border: 2px solid #808080;
            border-right-color: #fff;
            border-bottom-color: #fff;
            width: 50px;
            text-align: right;
            letter-spacing: 2px;
        }

        /* 那个黄脸按钮 */
        .face-btn {
            width: 36px;
            height: 36px;
            font-size: 24px;
            background: var(--bg-color);
            border: 2px solid #fff;
            border-right-color: #808080;
            border-bottom-color: #808080;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .face-btn:active {
            border: 2px solid #808080;
            border-right-color: #fff;
            border-bottom-color: #fff;
            padding-top: 2px; 
            padding-left: 2px;
        }

        /* 难度选择器 */
        .difficulty-select {
            margin-bottom: 10px;
        }
        select {
            padding: 5px;
            font-size: 14px;
            border-radius: 4px;
        }

        /* 雷区网格 */
        #grid {
            display: grid;
            border: 3px solid #808080;
            border-right-color: #fff;
            border-bottom-color: #fff;
            background: #808080; /* 格子间隙颜色 */
            gap: 0px; 
        }

        .cell {
            width: var(--cell-size);
            height: var(--cell-size);
            background-color: var(--bg-color);
            border: 2px solid #fff;
            border-right-color: #808080;
            border-bottom-color: #808080;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 16px; /* 数字大小 */
            cursor: default;
            box-sizing: border-box;
        }

        .cell:active:not(.open) {
            border: none;
            padding: 2px; /* 模拟按下 */
            background-color: #bdbdbd;
        }

        .cell.open {
            border: 1px solid #7b7b7b; /* 翻开后的微弱边框 */
            background-color: #d1d1d1;
        }

        .cell.bomb { background-color: #ff4d4d; border: 1px solid #7b7b7b; }
        .cell.flag { color: red; }
        
        /* 数字颜色 */
        .c1 { color: blue; }
        .c2 { color: green; }
        .c3 { color: red; }
        .c4 { color: darkblue; }
        .c5 { color: maroon; }
        .c6 { color: teal; }
        .c7 { color: black; }
        .c8 { color: gray; }

        /* 移动端控制条 */
        .mobile-controls {
            display: none; /* 默认桌面端隐藏 */
            margin-top: 15px;
            gap: 10px;
        }
        
        .mode-btn {
            padding: 10px 20px;
            font-size: 18px;
            border-radius: 20px;
            border: 2px solid #fff;
            background: #eee;
            cursor: pointer;
            width: 120px;
            text-align: center;
            font-weight: bold;
        }
        .mode-btn.active {
            background: #4CAF50;
            color: white;
            border-color: #2E7D32;
        }

        /* 响应式适配 */
        @media (max-width: 600px) {
            .mobile-controls { display: flex; }
            :root { --cell-size: 32px; } /* 手机端格子大一点 */
            body { padding-top: 20px; justify-content: flex-start; }
            .window { transform: scale(0.95); }
        }
    </style>
</head>
<body>

    <div class="difficulty-select">
        <select id="level-select" onchange="changeLevel()">
            <option value="easy">初级 (9x9, 10雷)</option>
            <option value="medium">中级 (16x16, 40雷)</option>
            <option value="hard">高级 (30x16, 99雷)</option>
        </select>
    </div>

    <div class="window">
        <div class="header">
            <div class="lcd-display" id="mine-display">010</div>
            <div class="face-btn" id="face-btn" onclick="resetGame()">🙂</div>
            <div class="lcd-display" id="time-display">000</div>
        </div>
        <div id="grid"></div>
    </div>

    <div class="mobile-controls">
        <div class="mode-btn active" id="btn-dig" onclick="setMode('dig')">⛏️ 挖掘</div>
        <div class="mode-btn" id="btn-flag" onclick="setMode('flag')">🚩 插旗</div>
    </div>

    <script>
        // 配置参数
        const LEVELS = {
            easy: { rows: 9, cols: 9, mines: 10 },
            medium: { rows: 16, cols: 16, mines: 40 },
            hard: { rows: 16, cols: 30, mines: 99 } // 经典高级是 16行 30列
        };

        let CONFIG = LEVELS.easy;
        let grid = [];
        let gameState = 'idle'; // idle, playing, lost, won
        let flagsUsed = 0;
        let timer = 0;
        let timerInterval;
        let firstClick = true; // 用于首发保护
        let currentMode = 'dig'; // dig 或 flag (移动端用)

        // DOM 元素
        const gridEl = document.getElementById('grid');
        const mineDisplay = document.getElementById('mine-display');
        const timeDisplay = document.getElementById('time-display');
        const faceBtn = document.getElementById('face-btn');
        const btnDig = document.getElementById('btn-dig');
        const btnFlag = document.getElementById('btn-flag');

        function changeLevel() {
            const val = document.getElementById('level-select').value;
            CONFIG = LEVELS[val];
            resetGame();
        }

        function resetGame() {
            clearInterval(timerInterval);
            gameState = 'idle';
            flagsUsed = 0;
            timer = 0;
            firstClick = true;
            grid = [];
            
            // 更新 UI
            faceBtn.innerText = '🙂';
            mineDisplay.innerText = formatNumber(CONFIG.mines);
            timeDisplay.innerText = '000';
            
            // 设置 Grid 样式
            gridEl.style.gridTemplateRows = `repeat(${CONFIG.rows}, var(--cell-size))`;
            gridEl.style.gridTemplateColumns = `repeat(${CONFIG.cols}, var(--cell-size))`;
            gridEl.innerHTML = '';

            // 生成空网格
            for (let r = 0; r < CONFIG.rows; r++) {
                let row = [];
                for (let c = 0; c < CONFIG.cols; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.r = r;
                    cell.dataset.c = c;
                    
                    // 绑定事件
                    cell.addEventListener('mousedown', (e) => handleMouseDown(e, r, c));
                    cell.addEventListener('mouseup', (e) => handleMouseUp(e, r, c));
                    // 禁用右键默认菜单
                    cell.addEventListener('contextmenu', (e) => e.preventDefault());

                    gridEl.appendChild(cell);
                    row.push({
                        el: cell,
                        isMine: false,
                        isOpen: false,
                        isFlagged: false,
                        nearby: 0
                    });
                }
                grid.push(row);
            }
        }

        // 处理鼠标按下（为了做笑脸惊讶效果）
        function handleMouseDown(e, r, c) {
            if (gameState === 'lost' || gameState === 'won') return;
            if (e.button === 0) faceBtn.innerText = '😮';
        }

        // 处理鼠标抬起（核心逻辑）
        function handleMouseUp(e, r, c) {
            faceBtn.innerText = '🙂';
            if (gameState === 'lost' || gameState === 'won') return;

            const cell = grid[r][c];

            // 区分左右键和移动端模式
            let isLeftClick = e.button === 0;
            let isRightClick = e.button === 2;

            if (currentMode === 'flag' && isLeftClick) {
                // 移动端插旗模式下，左键当作右键用
                isRightClick = true;
                isLeftClick = false;
            }

            if (isRightClick) {
                toggleFlag(r, c);
            } else if (isLeftClick) {
                if (cell.isOpen) {
                    // 🌟 高级功能：点击已翻开的数字进行“快速扫雷”(Chording)
                    chordReveal(r, c);
                } else {
                    clickCell(r, c);
                }
            }
        }

        function clickCell(r, c) {
            const cell = grid[r][c];
            if (cell.isFlagged || cell.isOpen) return;

            // 🌟 首发保护：如果是第一次点击，生成雷，并保证当前位置不含雷
            if (firstClick) {
                firstClick = false;
                startTimer();
                placeMines(r, c); // 传入避雷坐标
            }

            if (cell.isMine) {
                gameOver(false, r, c);
            } else {
                reveal(r, c);
                checkWin();
            }
        }

        function toggleFlag(r, c) {
            const cell = grid[r][c];
            if (cell.isOpen) return;

            cell.isFlagged = !cell.isFlagged;
            cell.el.classList.toggle('flag');
            cell.el.innerText = cell.isFlagged ? '🚩' : '';
            
            flagsUsed += cell.isFlagged ? 1 : -1;
            mineDisplay.innerText = formatNumber(CONFIG.mines - flagsUsed);
        }

        // 🌟 核心算法：生成地雷（避开 firstR, firstC）
        function placeMines(excludeR, excludeC) {
            let minesPlaced = 0;
            while (minesPlaced < CONFIG.mines) {
                const r = Math.floor(Math.random() * CONFIG.rows);
                const c = Math.floor(Math.random() * CONFIG.cols);

                // 规则：当前格不放雷，且周围8格也不放雷（为了开局能开出一片空地，体验更好）
                if (Math.abs(r - excludeR) <= 1 && Math.abs(c - excludeC) <= 1) continue;

                if (!grid[r][c].isMine) {
                    grid[r][c].isMine = true;
                    minesPlaced++;
                }
            }

            // 计算所有格子的数字
            for (let r = 0; r < CONFIG.rows; r++) {
                for (let c = 0; c < CONFIG.cols; c++) {
                    if (!grid[r][c].isMine) {
                        grid[r][c].nearby = countMines(r, c);
                    }
                }
            }
        }

        function countMines(r, c) {
            let count = 0;
            for (let i = r - 1; i <= r + 1; i++) {
                for (let j = c - 1; j <= c + 1; j++) {
                    if (i >= 0 && i < CONFIG.rows && j >= 0 && j < CONFIG.cols) {
                        if (grid[i][j].isMine) count++;
                    }
                }
            }
            return count;
        }

        // 递归翻开
        function reveal(r, c) {
            if (r < 0 || r >= CONFIG.rows || c < 0 || c >= CONFIG.cols) return;
            const cell = grid[r][c];
            if (cell.isOpen || cell.isFlagged) return;

            cell.isOpen = true;
            cell.el.classList.add('open');

            if (cell.nearby > 0) {
                cell.el.innerText = cell.nearby;
                cell.el.classList.add('c' + cell.nearby);
            } else {
                // 如果是空白（0），递归翻开周围
                for (let i = r - 1; i <= r + 1; i++) {
                    for (let j = c - 1; j <= c + 1; j++) {
                        reveal(i, j);
                    }
                }
            }
        }

        // 🌟 高级功能：双击开雷（Chording）
        // 如果数字是 2，且周围已经插了 2 个旗子，点击数字会自动翻开剩下的
        function chordReveal(r, c) {
            const cell = grid[r][c];
            if (cell.nearby === 0) return;

            // 计算周围旗子数
            let flagCount = 0;
            for (let i = r - 1; i <= r + 1; i++) {
                for (let j = c - 1; j <= c + 1; j++) {
                    if (i >= 0 && i < CONFIG.rows && j >= 0 && j < CONFIG.cols) {
                        if (grid[i][j].isFlagged) flagCount++;
                    }
                }
            }

            // 如果旗子数等于数字，翻开周围非旗子格子
            if (flagCount === cell.nearby) {
                for (let i = r - 1; i <= r + 1; i++) {
                    for (let j = c - 1; j <= c + 1; j++) {
                        if (i >= 0 && i < CONFIG.rows && j >= 0 && j < CONFIG.cols) {
                            if (!grid[i][j].isOpen && !grid[i][j].isFlagged) {
                                // 这里要小心，如果旗子插错了，会引爆
                                clickCell(i, j); 
                            }
                        }
                    }
                }
            }
        }

        function gameOver(win, r, c) {
            clearInterval(timerInterval);
            gameState = win ? 'won' : 'lost';
            faceBtn.innerText = win ? '😎' : '😵';

            if (!win) {
                // 踩雷了：显示所有雷，并在踩到的雷上标记
                grid[r][c].el.style.backgroundColor = 'red';
                for (let row of grid) {
                    for (let cell of row) {
                        if (cell.isMine) {
                            cell.el.innerText = '💣';
                            if (!cell.isFlagged) cell.el.classList.add('open'); // 没插旗的雷显示出来
                        } else if (cell.isFlagged) {
                            // 插错旗了
                            cell.el.innerText = '❌'; 
                        }
                    }
                }
                alert('💥 BOOM! 游戏结束');
            } else {
                alert(`🎉 恭喜! 用时 ${timer} 秒`);
            }
        }

        function checkWin() {
            let revealed = 0;
            for (let row of grid) {
                for (let cell of row) {
                    if (cell.isOpen) revealed++;
                }
            }
            if (revealed === (CONFIG.rows * CONFIG.cols - CONFIG.mines)) {
                gameOver(true);
            }
        }

        // 计时器
        function startTimer() {
            gameState = 'playing';
            timer = 0;
            timerInterval = setInterval(() => {
                timer++;
                timeDisplay.innerText = formatNumber(timer);
                if (timer > 999) clearInterval(timerInterval);
            }, 1000);
        }

        function formatNumber(num) {
            if (num < 0) return '000'; // 简单处理负数
            return num.toString().padStart(3, '0');
        }

        // 移动端模式切换
        function setMode(mode) {
            currentMode = mode;
            if (mode === 'dig') {
                btnDig.classList.add('active');
                btnFlag.classList.remove('active');
            } else {
                btnFlag.classList.add('active');
                btnDig.classList.remove('active');
            }
        }

        // 初始化
        resetGame();

    </script>
</body>
</html>
